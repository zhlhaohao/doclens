[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "1.1.44"
description = "Structure-aware document retrieval. FTS5/BM25 keyword matching over document trees."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Lianghao", email = "zhlhao@163.com"},
]
keywords = ["doclens", "rag", "retrieval", "tree-search", "bm25", "fts5", "document-indexing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # Core
    "fastapi>=0.110.0",
    "cryptography>=42.0.0,<47",  # 47+ 在 PyPI 上没有 win_arm64 wheel（只有 46.0.0-46.0.3 有）
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    # MCP server (Streamable HTTP) — 暴露 KB 检索为 MCP 工具，TUI/GUI 进程内自启。
    # 纯 Python，传递依赖（starlette/sse-starlette/uvicorn/pydantic/httpx）多数已在。
    # mcp 2.0 起 FastMCP 改名为 MCPServer（见 doclens/mcp_server.py），故下限 2.0。
    "mcp>=2.0",
    "textual>=0.47.0",
    "ulid-py>=1.1",
    "uvicorn[standard]>=0.27.0",
    "ripgrep-bin>=15.1.0",
    # 索引引擎经 PyPI 分发（treesearchlib，import 名 treesearch）——发行版不再内嵌源码；
    # 开发态用 `pip install -e ./treesearch` 以本地源码覆盖（见 CLAUDE.md 安装节）。
    # extras 对应原内嵌时的依赖清单：cjk=jieba、parsers=PDF/DOCX/PPTX/XLSX/HTML、
    # image=Pillow+piexif、convert=markitdown、gitignore=pathspec、
    # legacy=firecrawl-anydoc（win_arm64 无 wheel，需 Rust 工具链从 sdist 构建）
    "treesearchlib[cjk,parsers,image,convert,gitignore,legacy]>=1.1.1",
    # AI Agent 框架经 PyPI 分发（import 名 planify）——发行版不再内嵌源码；
    # 开发态用 `pip install -e ./planify` 以本地源码覆盖（见 CLAUDE.md 安装节）。
    # anthropic/openai/httpx/borax 均为其传递依赖，doclens 零直接使用
    "planify>=1.0.0",
    # Background file-system watcher (TUI live reindex)
    "watchdog>=3.0",
    # 日记照片上传压缩（1600px/q80 WebP，ADR-0007；doclens/diary.py 直接使用）
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "playwright>=1.40.0",
    "respx>=0.21",
]
# tree-sitter-languages 在 Windows ARM64 / Python 3.12 上无预编译包（平台无 wheel），
# 故设为可选依赖。运行时由 try/except ImportError 保护（见 treesearch/parsers/treesitter_parser.py）。
ast = [
    "treesearchlib[ast]>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/zhlhaohao/doclens"
Repository = "https://github.com/zhlhaohao/doclens"
Issues = "https://github.com/zhlhaohao/doclens/issues"

[project.scripts]
doclens = "doclens.cortex_cli:main"

# treesearch / planify 均不内嵌（发行版分别经 treesearchlib / planify 依赖安装；
# 两者的 CLI 入口由各自分发包自带）。开发态 `pip install -e ./treesearch`、
# `pip install -e ./planify` 以本地源码覆盖。
[tool.setuptools.packages.find]
include = ["doclens*"]

# 非 .py 资源：前端 PWA 构建产物、配置模板、Agent skills。
# 缺少这个会导致 pip install 后 gui 找不到前端页面。
[tool.setuptools.package-data]
doclens = [
    "web_v2/static/**/*",
    ".env.example",
    "skills/**/*",
    "claude_code_skills/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
