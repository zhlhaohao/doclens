[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "1.1.16"
description = "Structure-aware document retrieval. FTS5/BM25 keyword matching over document trees."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Lianghao", email = "zhlhao@163.com"},
]
keywords = ["doclens", "rag", "retrieval", "tree-search", "bm25", "fts5", "document-indexing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # Core
    "anthropic>=0.25.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.1",
    "cryptography>=42.0.0,<47",  # 47+ 在 PyPI 上没有 win_arm64 wheel（只有 46.0.0-46.0.3 有）
    "jieba>=0.42",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    # MCP server (Streamable HTTP) — 暴露 KB 检索为 MCP 工具，TUI/GUI 进程内自启。
    # 纯 Python，传递依赖（starlette/sse-starlette/uvicorn/pydantic/httpx）多数已在。
    # mcp 2.0 起 FastMCP 改名为 MCPServer（见 doclens/mcp_server.py），故下限 2.0。
    "mcp>=2.0",
    "textual>=0.47.0",
    "tqdm>=4.42",
    "ulid-py>=1.1",
    "uvicorn[standard]>=0.27.0",
    "ripgrep-bin>=15.1.0",
    # Multi-format document parsers (PDF / DOCX / PPTX / Excel / HTML / code AST / gitignore)
    "beautifulsoup4>=4.12.0",
    "markitdown>=0.1.0",
    "openpyxl>=3.1.0",
    "pathspec>=0.11",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    # tree-sitter-languages 在 Windows ARM64 / Python 3.12 上无预编译包（平台无 wheel），
    # 移至 [ast] 可选依赖组；运行时由 try/except ImportError 保护
    # Background file-system watcher (TUI live reindex)
    "watchdog>=3.0",
    # Planify agent tools: lunar/weather 工具依赖 borax（农历计算）
    "borax>=4.1.0",
    # 日记照片上传压缩（1600px/q80 WebP，ADR-0007）
    "Pillow>=10.0.0",
    # 图像 EXIF 元数据无损读写（vision 解读结果写回图像文件，ADR-0009）
    "piexif>=1.1.3",
    # LLM provider SDKs (Anthropic native + OpenAI-compatible)
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "playwright>=1.40.0",
    "respx>=0.21",
]
# tree-sitter-languages 在 Windows ARM64 / Python 3.12 上无预编译包（平台无 wheel），
# 故设为可选依赖。运行时由 try/except ImportError 保护（见 treesearch/parsers/treesitter_parser.py）。
ast = [
    "tree-sitter-languages>=1.10",
]

[project.urls]
Homepage = "https://github.com/zhlhaohao/doclens"
Repository = "https://github.com/zhlhaohao/doclens"
Issues = "https://github.com/zhlhaohao/doclens/issues"

[project.scripts]
treesearch = "treesearch.cli:main"
doclens = "doclens.cortex_cli:main"

[tool.setuptools.packages.find]
include = ["treesearch*", "doclens*", "planify*"]

# 非 .py 资源：前端 PWA 构建产物、配置模板、Agent skills。
# 缺少这个会导致 pip install 后 gui 找不到前端页面。
[tool.setuptools.package-data]
doclens = [
    "web_v2/static/**/*",
    ".env.example",
    "skills/**/*",
    "claude_code_skills/**/*",
]
treesearch = ["_bin/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
