<!-- 版式：two-col 左右双栏。正文 --- 水平线为栏切分符。根容器四周留白 -->
<div class="col" data-x="5%" data-y="4%" data-w="90%" data-h="92%">
  <slot name="title" data-h="16%" data-min-h="10%" data-role="h1"/>
  <div class="row" data-h="84%" data-gap="4%">
    <slot name="left" data-grow="1"/>
    <slot name="right" data-grow="1"/>
  </div>
</div>
