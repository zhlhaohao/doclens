<!-- 版式：two-col 左右双栏 —— 正文中 --- 水平线为栏切分符 -->
<div class="slide-inner layout-two-col"
     data-cap='{"bullets": 8, "bullet_chars": 34, "total_chars": 260, "table_rows": 6, "table_cols": 3, "image_min_ratio": 0.0}'>
  <div class="slot-title">{{title}}</div>
  <div class="slot-body-row">
    <div class="col">{{left}}</div>
    <div class="col">{{right}}</div>
  </div>
</div>
<style>
  .layout-two-col .slot-title { padding-bottom: 16px; margin-bottom: 4px; border-bottom: 2px solid color-mix(in srgb, var(--c-primary) 30%, transparent); }
  .layout-two-col .slot-body-row { gap: 48px; }
  .layout-two-col .col:first-child { padding-right: 40px; border-right: 1px solid color-mix(in srgb, var(--c-text) 10%, transparent); }
  .layout-two-col .col { overflow: hidden; }
</style>
