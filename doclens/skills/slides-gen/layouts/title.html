<!-- 版式：title 封面页 —— 大标题 + 副标题 + 落款 -->
<div class="slide-inner layout-title"
     data-cap='{"bullets": 0, "bullet_chars": 0, "total_chars": 80, "table_rows": 0, "table_cols": 0, "image_min_ratio": 0.0}'>
  <div class="slot-title">{{title}}</div>
  <div class="slot-content">{{content}}</div>
</div>
<style>
  .layout-title { justify-content: center; align-items: center; gap: 34px; text-align: center; padding-top: 3%; }
  .layout-title .slot-title h1 { font-size: calc(var(--fs-h1) * 1.34 * var(--fit, 1)); line-height: 1.24; color: var(--c-text); max-width: 86%; margin: 0 auto; font-weight: 700; }
  .layout-title .slot-content { flex: 0 0 auto; }
  .layout-title .slot-content p { color: var(--c-text); opacity: .82; font-weight: 400; font-size: calc(var(--fs-body) * .98 * var(--fit, 1)); margin-bottom: 6px; }
  .layout-title .slot-content p:last-child { font-size: calc(var(--fs-body) * .8 * var(--fit, 1)); color: var(--c-text); opacity: .62; margin-top: 22px; letter-spacing: .03em; }
  .layout-title .slot-content ul { display: inline-block; text-align: left; margin-top: 8px; }
</style>
