<!-- 版式：closing 收尾行动页 —— 决定请求 + 下一步（列表：每条一步，可含负责人/期限） -->
<div class="slide-inner layout-closing"
     data-cap='{"bullets": 4, "bullet_chars": 50, "total_chars": 180, "table_rows": 5, "table_cols": 3, "image_min_ratio": 0.0}'>
  <div class="cl-ask">{{title}}</div>
  <div class="cl-body">{{content}}</div>
</div>
<style>
  .layout-closing { justify-content: center; gap: 30px; }
  .cl-ask {
    font-size: calc(var(--fs-h1) * 1.12 * var(--fit, 1));
    font-weight: 800; line-height: 1.3; color: var(--c-text);
    padding-left: 20px; border-left: 6px solid var(--c-accent);
  }
  .cl-body { display: flex; flex-direction: column; gap: .55em; }
  .cl-step {
    display: flex; align-items: baseline; gap: 1em;
    padding: .5em 0;
    border-bottom: 1px solid color-mix(in srgb, var(--c-text) 8%, transparent);
    font-size: calc(var(--fs-body) * .92 * var(--fit, 1)); line-height: 1.45;
  }
  .cl-step:last-child { border-bottom: none; }
  .cl-step strong { color: var(--c-primary); }
</style>
