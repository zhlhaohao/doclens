[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# 说明：pyproject.toml 位于包目录内部（planify/ 即包本体），属非标准布局——
# 通过 package-dir 把包名映射到当前目录，packages 显式列出全部子包。
# work-dir/（运行时杂物）、docs/、__pycache__ 等不在包列表内，天然被排除。

[project]
name = "planify"
dynamic = ["version"]
description = "LLM Agent framework: streaming agent loop, tool registry, dual provider backends (Anthropic / OpenAI-compatible), prompt caching friendly."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Lianghao", email = "zhlhao@163.com"},
]
keywords = ["agent", "llm", "anthropic", "openai", "streaming", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0",
    "httpx>=0.27.1",
    "python-dotenv>=1.0.0",
    # 农历/节气/节日（tools/lunar.py，天气工具链顶层 import，需随核心安装）
    "borax>=4.1.0",
]

[project.optional-dependencies]
# tools/webfetch.py 的网页抓取增强：函数内惰性 import，未装时自动降级/报错提示
fetch = [
    "trafilatura>=1.6",
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
planify = "planify.cli:main"

[tool.setuptools]
package-dir = {"planify" = "."}
packages = [
    "planify",
    "planify.agent",
    "planify.context",
    "planify.core",
    "planify.core.llm",
    "planify.managers",
    "planify.messaging",
    "planify.skills",
    "planify.streaming",
    "planify.subagent",
    "planify.tools",
]

[tool.setuptools.dynamic]
version = {attr = "planify.__version__"}
